version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 20102010
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: ":8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres_password"
      DB_NAME: "shop_db"
      DB_SSLMODE: "disable"
      JWT_SECRET: "super-secret-key-production-ready-min-32-chars"
      JWT_TTL: "24h"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
